<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} ・ RAG Wiki 教學簡報</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf7f1;--card:#fff;--ink:#1f2a37;--muted:#5d6b7a;--line:#e4ddd0;--code:#f1ede4;--accent:#1f3a5f;--teal:#2a9d8f}
@media (prefers-color-scheme:dark){:root{--paper:#141821;--card:#1c222d;--ink:#e6e9ef;--muted:#9aa6b5;--line:#2c3542;--code:#232b38}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.7;display:flex;flex-direction:column}
a{color:var(--teal)}
code{background:var(--code);padding:1px 6px;border-radius:5px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);font-size:14px;color:var(--muted)}
.bar b{color:var(--ink)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.slide{display:none;width:min(960px,100%);min-height:min(540px,80vh);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 56px;box-shadow:0 10px 30px rgba(0,0,0,.06);position:relative}
.slide.on{display:block}
.slide h1{font-size:40px;line-height:1.3;margin:0 0 18px;font-weight:900;color:var(--accent)}
.slide h2{font-size:30px;margin:0 0 18px;font-weight:900;color:var(--accent);padding-left:14px;border-left:5px solid var(--teal)}
.slide p,.slide li{font-size:20px;margin:8px 0}
.slide ul,.slide ol{padding-left:28px}
.slide table{border-collapse:collapse;width:100%;font-size:18px;margin-top:8px}
.slide th,.slide td{border:1px solid var(--line);padding:8px 12px;text-align:left}.slide th{background:var(--code)}
.slide blockquote{margin:12px 0;padding:10px 18px;border-left:4px solid var(--teal);background:var(--code);border-radius:0 10px 10px 0;font-size:19px}
.src{position:absolute;right:24px;bottom:16px;font-size:13px;color:var(--muted)}
.src a{color:var(--muted);border-bottom:1px dashed var(--muted);text-decoration:none}
.nav{display:flex;justify-content:center;gap:10px;padding:10px 0 22px;font-size:14px;color:var(--muted)}
.nav button{font:inherit;padding:6px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
@media (max-width:640px){.slide{padding:26px 22px}.slide h1{font-size:28px}.slide h2{font-size:22px}.slide p,.slide li{font-size:17px}}
</style>
</head>
<body>
<div class="bar"><span><b>{{title}}</b> ・ 由 RAG Wiki 生成</span><span><a href="index.html">回 Wiki</a></span></div>
<div class="stage">
{{slides}}
</div>
<div class="nav"><button id="prev">← 上一頁</button><span id="pos"></span><button id="next">下一頁 →</button></div>
<script>
const S=[...document.querySelectorAll('.slide')];let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
const show=n=>{i=(n+S.length)%S.length;S.forEach((s,k)=>s.classList.toggle('on',k===i));pos.textContent=(i+1)+' / '+S.length;history.replaceState(null,'','#'+(i+1));};
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}});
show(i);
</script>
</body>
</html>
